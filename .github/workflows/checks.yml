name: Verify study artifacts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check source and reported results
        run: python -m unittest discover -s tests -v
      - name: Check syntax
        run: python -m py_compile audit_data.py train_compare.py experiment.py visualize_errors.py
